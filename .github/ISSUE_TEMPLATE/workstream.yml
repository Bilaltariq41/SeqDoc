name: Workstream
description: A substantial contributor-owned capability; canonical work-item records own lifecycle and dependencies.
title: "[Workstream] "
labels: ["workstream"]
body:
  - type: markdown
    attributes:
      value: "A workstream groups one or more independently claimable implementation issues."
  - type: input
    id: canonical-record
    attributes:
      label: Local planning ID or pending canonical registration
      description: Provide the planning ID when applicable, or write pending canonical registration. The worker or coordinator records the work item and capsule when claiming eligible work.
  - type: input
    id: owner
    attributes:
      label: Workstream owner
      description: GitHub username responsible for driving this workstream.
      placeholder: "@username"
    validations:
      required: true
  - type: input
    id: planning-id
    attributes:
      label: Local planning ID, if applicable
      placeholder: "S-1 or none"
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: User-visible capability and why it matters.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Scope and non-goals
      description: Included semantic boundaries, excluded work, and target paths when known.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Required tests, supplied applications, diagrams, and observable completion criteria.
    validations:
      required: true
  - type: textarea
    id: implementation-issues
    attributes:
      label: Planned implementation issues and dependencies
      description: Link implementation issues and identify dependencies. Implementation issues cannot create child issues.
    validations:
      required: true
  - type: textarea
    id: governance
    attributes:
      label: Planned decision tier, exact path lease, first observable, focused command, and final gate
      description: State planning-time governance and verification inputs; candidate heads and receipts belong in the PR.
    validations:
      required: true
