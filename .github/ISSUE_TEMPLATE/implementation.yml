name: Implementation issue
description: A reviewable slice of an approved workstream; canonical work-item records own lifecycle and dependencies.
title: "[Implementation] "
labels: ["implementation"]
body:
  - type: input
    id: parent
    attributes:
      label: Parent workstream
      placeholder: "#123"
    validations:
      required: true
  - type: input
    id: canonical-record
    attributes:
      label: Local planning ID or pending canonical registration
      description: Provide the planning ID when applicable, or write pending canonical registration. A contributor or coordinator records the work item and capsule when claiming eligible work.
  - type: input
    id: planning-id
    attributes:
      label: Local planning ID, if applicable
      placeholder: "C-2 or none"
  - type: input
    id: baseline-head
    attributes:
      label: Baseline SHA and planned branch
      description: Record the frozen baseline and intended branch before implementation; candidate head belongs in the PR and receipt.
  - type: textarea
    id: purpose
    attributes:
      label: Purpose and accepted behavior
    validations:
      required: true
  - type: textarea
    id: targets
    attributes:
      label: Starting target paths
      description: Initial production/test paths. Expand them when reasonably needed for the same outcome and record the change in the issue/checkpoint.
    validations:
      required: true
  - type: textarea
    id: nongoals
    attributes:
      label: Non-goals and dependencies
    validations:
      required: true
  - type: markdown
    attributes:
      value: "Implementation issues cannot create child issues. Absorb discoveries serving this outcome or return them to the parent backlog; create a new issue only for a genuinely independent deliverable."
  - type: textarea
    id: risks
    attributes:
      label: Risk inventory
      description: False positives, evidence/certainty, identity, profile, persistence, determinism, or regression risks.
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: Verification
      description: Focused command, final gate, and realistic acceptance output.
    validations:
      required: true
  - type: textarea
    id: planned-governance
    attributes:
      label: Decision tier, proposed exact path lease, first observable, focused command, and final gate
      description: Record planning-time governance and verification inputs; candidate head and receipts belong in the PR.
    validations:
      required: true
